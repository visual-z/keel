# keel.toml — the only machine configuration in the workspace.
# keel reads every command from here and never guesses the stack.
#
# This file describes the template itself: keel checks its own repository
# (it eats its own dog food). In a new project, `python3 tools/keel.py init
# --name <name> --stack <preset>` replaces it with tools/presets/<preset>.toml.

[project]
name = "keel"
stack = "unittest"

[[gate.step]]
name = "unit"
cmd = ["python3", "-m", "unittest", "discover", "-s", "tools/tests"]
runner = "unittest"

[[gate.step]]
name = "boundaries"
cmd = ["python3", "tools/keel.py", "check-boundaries"]

[[gate.step]]
name = "docs"
cmd = ["python3", "tools/keel.py", "check-docs"]

[[gate.step]]
name = "cards"
cmd = ["python3", "tools/keel.py", "lint"]

[[gate.step]]
name = "freeze"
cmd = ["python3", "tools/keel.py", "freeze-check"]

[red]
runner = "unittest"
command = ["python3", "-m", "unittest", "discover", "-s", "tools/tests", "-k", "{filter}"]
link = []
env = {}
timeout_s = 600

[tests]
paths = ["tools/tests/**"]
assert_patterns = ['\bself\.assert\w*\(', '\bassert\b']
skip_patterns = ['\bunittest\.skip', '\.skipTest\(']
suspicious_patterns = ['\bsys\.exit\(', 'def __eq__']

[guard]
base = "main"

[docs]
agents_max_lines = 150
playbook_max_rules = 120
glossary_source_dirs = ["tools"]

# The trusted kernel stays standard-library only, so it runs in any project.
[[boundary.rule]]
name = "kernel stays stdlib-only"
paths = ["tools/keel.py"]
forbid = ['^\s*(import|from)\s+(requests|yaml|toml|click|rich|pydantic)\b']

[mutate]
command = []
