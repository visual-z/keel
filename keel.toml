# keel checks its own repository with keel (dogfooding). This file is for the
# keel repository only; new projects get template/presets/<stack>.toml.
[keel]
version = "1.1.0"

[project]
name = "keel"
stack = "go"

[[gate.step]]
name = "build"
cmd = ["go", "build", "./..."]

[[gate.step]]
name = "vet"
cmd = ["go", "vet", "./..."]

[[gate.step]]
name = "test"
cmd = ["go", "test", "-race", "-count=1", "-json", "./..."]
runner = "go-json"

[[gate.step]]
name = "fmt"
cmd = ["sh", "-c", "test -z \"$(gofmt -l cmd internal *.go)\""]

[[gate.step]]
name = "docs"
cmd = ["keel", "check-docs"]

[[gate.step]]
name = "boundaries"
cmd = ["keel", "check-boundaries"]

[red]
runner = "go-json"
command = ["go", "test", "-count=1", "-json", "{args}"]
timeout_s = 600

[tests]
paths = ["internal/keel/*_test.go", "internal/keel/testdata/**"]
assert_patterns = ['\bt\.(Error|Errorf|Fatal|Fatalf|Fail|FailNow)\(', '^\s*!?\s*(exec|stdout|stderr|grep|exists|cmp)\b']
skip_patterns = ['\bt\.Skip(f|Now)?\(', '^\s*skip\b']
suspicious_patterns = ['\bos\.Exit\(0\)']

[paths]
tasks = "template/docs/tasks"

[docs]
# The repository root is keel's own README, not a project map.
agents = "README.md"
agents_max_lines = 200
map_files = ["README.md"]
playbook = "template/docs/PLAYBOOK.md"
progress = "template/docs/PROGRESS.md"
plan = "template/PLAN.md"
invariants = "template/docs/INVARIANTS.md"
fixtures = "template/docs/FIXTURES.md"
glossary = "template/CONTEXT.md"

# The kernel stays dependency-light: TOML and the test-only testscript.
[[boundary.rule]]
name = "kernel imports"
paths = ["internal/keel/*.go"]
except = ["internal/keel/*_test.go"]
forbid = ['"github\.com/(?:spf13|urfave|fatih|charmbracelet)/']
