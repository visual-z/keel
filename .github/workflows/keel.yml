name: keel
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # freeze-check and verify-red read card history and RED commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Add your stack's toolchain setup here (rust-toolchain, setup-go, setup-node …).
      - name: gate
        run: python3 tools/keel.py gate
      - name: keel self-mutation (template repository only)
        if: hashFiles('tools/self_mutation.py') != '' && github.event.repository.name == 'keel'
        run: python3 tools/self_mutation.py
      - name: assert-guard
        if: github.event_name == 'pull_request'
        run: python3 tools/keel.py assert-guard --base "origin/${{ github.base_ref }}"
      - name: verify-red on changed cards
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          base="origin/${{ github.base_ref }}"
          for card in $(git diff --name-only --diff-filter=AM "$base"...HEAD -- 'docs/tasks/*.md'); do
            case "$card" in */TEMPLATE*|*/README.md) continue ;; esac
            if grep -Eq '^(RED: [0-9a-f]{7,}|```diff keel-inject )' "$card"; then
              python3 tools/keel.py verify-red "$card"
            fi
          done
