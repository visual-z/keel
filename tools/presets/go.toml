# keel 预设：Go。
[project]
name = "{{PROJECT_NAME}}"
stack = "go"

[[gate.step]]
name = "build"
cmd = ["go", "build", "./..."]

[[gate.step]]
name = "vet"
cmd = ["go", "vet", "./..."]

[[gate.step]]
name = "test"
cmd = ["go", "test", "-race", "-count=1", "-v", "./..."]
runner = "go"

[[gate.step]]
name = "fmt"
cmd = ["sh", "-c", "test -z \"$(gofmt -l .)\""]

[[gate.step]]
name = "boundaries"
cmd = ["python3", "tools/keel.py", "check-boundaries"]

[[gate.step]]
name = "docs"
cmd = ["python3", "tools/keel.py", "check-docs"]

[[gate.step]]
name = "cards"
cmd = ["python3", "tools/keel.py", "lint"]

[[gate.step]]
name = "freeze"
cmd = ["python3", "tools/keel.py", "freeze-check"]

[guard]
base = "main"

[docs]
agents_max_lines = 150     # AGENTS.md 是地图不是百科；超了就把细节下沉或机械化
playbook_max_rules = 120   # 规则只增不减会撞墙；超了就合并或改写成检查
glossary_source_dirs = []  # 填源码目录后，CONTEXT.md「避免」列的词在源码中出现即失败

# 边界规则：正则级的「Never」。每条新规则都要先故意违规一次确认它会红。
# [[boundary.rule]]
# name = "core 不做 I/O"
# paths = ["src/core/**"]
# forbid = ["⟨禁用的 import 正则⟩"]

[red]
runner = "go"
# filter 是 -run 的正则：写 '^TestName$' 精确选中
command = ["go", "test", "-count=1", "-v", "-run", "{filter}", "./..."]
link = []
env = {}
timeout_s = 1800

[tests]
paths = ["**/*_test.go"]
assert_patterns = ['\bt\.(Error|Errorf|Fatal|Fatalf|Fail|FailNow)\(', '\b(require|assert)\.\w+\(']
skip_patterns = ['\bt\.Skip(f|Now)?\(']
suspicious_patterns = ['\bos\.Exit\(']

[mutate]
command = []   # 例：["go-mutesting", "./..."]；Go 生态没有 diff 内变异的事实标准
