# keel 预设：Rust / cargo。复制为 keel.toml 后按项目调整。
[project]
name = "{{PROJECT_NAME}}"
stack = "cargo"

[[gate.step]]
name = "build"
cmd = ["cargo", "build", "--locked"]

[[gate.step]]
name = "test"
cmd = ["cargo", "test", "--locked", "--no-fail-fast"]
runner = "cargo"

[[gate.step]]
name = "clippy"
cmd = ["cargo", "clippy", "--workspace", "--all-targets", "--locked", "--", "-D", "warnings"]

[[gate.step]]
name = "fmt"
cmd = ["cargo", "fmt", "--check"]

[[gate.step]]
name = "boundaries"
cmd = ["python3", "tools/keel.py", "check-boundaries"]

[[gate.step]]
name = "docs"
cmd = ["python3", "tools/keel.py", "check-docs"]

[[gate.step]]
name = "cards"
cmd = ["python3", "tools/keel.py", "lint"]

[[gate.step]]
name = "freeze"
cmd = ["python3", "tools/keel.py", "freeze-check"]

[guard]
base = "main"

[docs]
agents_max_lines = 150     # AGENTS.md 是地图不是百科；超了就把细节下沉或机械化
playbook_max_rules = 120   # 规则只增不减会撞墙；超了就合并或改写成检查
glossary_source_dirs = []  # 填源码目录后，CONTEXT.md「避免」列的词在源码中出现即失败

# 边界规则：正则级的「Never」。每条新规则都要先故意违规一次确认它会红。
# [[boundary.rule]]
# name = "core 不做 I/O"
# paths = ["src/core/**"]
# forbid = ["⟨禁用的 import 正则⟩"]

[red]
runner = "cargo"
command = ["cargo", "test", "--locked", "--no-fail-fast", "{filter}"]
link = []
# 临时 worktree 用私有 target 目录：既不与主工作区交替写产物，也免每次冷编译
env = { CARGO_TARGET_DIR = "{cache}/cargo-target" }
timeout_s = 3600

[tests]
paths = ["tests/**", "**/tests/**", "benches/**"]
inline_paths = ["src/**", "**/src/**"]   # Rust 单元测试与 debug_assert 住在 src 里
assert_patterns = ['\b(debug_)?assert(_eq|_ne|_matches)?!', '\bprop_assert(_eq|_ne)?!']
skip_patterns = ['#\[ignore']
suspicious_patterns = ['std::process::exit', '\bprocess::exit\(']

[mutate]
# 只变异本分支改过的代码（Google 的 diff 内变异做法）；需 cargo install cargo-mutants
command = ["cargo", "mutants", "--in-diff", "{diff}"]
