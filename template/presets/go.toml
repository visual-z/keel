# keel preset: go. `keel init` writes this as keel.toml; adjust it to the project.
[keel]
version = "{{KEEL_VERSION}}"   # the keel release this repository is checked with

[project]
name = "{{PROJECT_NAME}}"
stack = "go"

[[gate.step]]
name = "build"
cmd = ["go", "build", "./..."]

[[gate.step]]
name = "vet"
cmd = ["go", "vet", "./..."]

[[gate.step]]
name = "test"
cmd = ["go", "test", "-race", "-count=1", "-json", "./..."]
runner = "go-json"

[[gate.step]]
name = "fmt"
cmd = ["sh", "-c", "test -z \"$(gofmt -l .)\""]

[[gate.step]]
name = "boundaries"
cmd = ["keel", "check-boundaries"]

[[gate.step]]
name = "docs"
cmd = ["keel", "check-docs"]

[[gate.step]]
name = "cards"
cmd = ["keel", "lint"]

[[gate.step]]
name = "freeze"
cmd = ["keel", "freeze-check"]

[guard]
base = "main"

[docs]
agents_max_lines = 150     # AGENTS.md 是地图不是百科；超了就把细节下沉或机械化
playbook_max_rules = 120   # 规则只增不减会撞墙；超了就合并或改写成检查
glossary_source_dirs = []  # 填源码目录后，CONTEXT.md「避免」列的词在源码中出现即失败

# 边界规则：正则级的「Never」。每条新规则都要先故意违规一次确认它会红。
# [[boundary.rule]]
# name = "core 不做 I/O"
# paths = ["src/core/**"]
# forbid = ["⟨禁用的 import 正则⟩"]

[red]
runner = "go-json"   # go test -json: structured events, no text parsing
# {args}: RED: <commit> -run '^TestName$' ./pkg/...
command = ["go", "test", "-count=1", "-json", "{args}"]
link = []
env = {}
timeout_s = 1800

[tests]
paths = ["**/*_test.go"]
assert_patterns = ['\bt\.(Error|Errorf|Fatal|Fatalf|Fail|FailNow)\(', '\b(require|assert)\.\w+\(']
skip_patterns = ['\bt\.Skip(f|Now)?\(']
suspicious_patterns = ['\bos\.Exit\(']

[mutate]
command = []   # e.g. ["gremlins", "unleash", "--diff", "{base}"]
